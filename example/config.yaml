# Example config for a protein that binds mature mRNA (UTRs and exons).
# Copy it, set the name and point the paths at your own files, then:
#   rbp-pipeline run my_protein.yaml
name: MY_PROTEIN                               # used for the output folder and file names
input: ~/ref/MY_PROTEIN_peaks.bed              # ENCODE eCLIP IDR peaks (BED6+)
output_dir: results

reference:
  genome: ~/ref/GRCh38.primary_assembly.genome.fa
  genes_bed: null                          # not needed with negatives.source: gtf
  gtf: ~/ref/gencode.v49.primary_assembly.annotation.gtf

peaks:
  min_log2fc: 3
  min_log10p: 3
  window: 100

negatives:
  strategy: gc-matched
  gc_candidates: 30
  source: gtf                            # stranded UTR / exonic regions built from the GTF
  region_classes: [UTR, exonic]          # mRNA binder; use [intronic] (or add it) for intron binders
  match_region: true                     # each peak's negatives from its own class, same strand

split:
  leakage: report

evaluation:
  n_seeds: 5
  bootstrap: 1000

model:
  lr_kmers: [3, 4, 5]                    # readable LR k-mers, long enough for 4-5 nt motifs

interpretation:
  n_sequences: 500
  # known_motifs:                        # optional: motifs reported for your protein (name: IUPAC)
  #   MY_MOTIF: UGCAUG
  motif_db: null                         # e.g. ~/ref/motif_databases/RNA/Ray2013_rbp_Homo_sapiens.meme
  enrichment: true                       # needs internet
