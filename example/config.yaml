# Example config. Copy it, point the paths at your own files, then:
#   rbp-pipeline run example/config.yaml
name: IGF2BP2
input: ~/ref/IGF2BP2_peaks.bed
output_dir: results

reference:
  genome: ~/ref/GRCh38.primary_assembly.genome.fa
  genes_bed: null                          # not needed with negatives.source: gtf
  gtf: ~/ref/gencode.v49.primary_assembly.annotation.gtf

peaks:
  min_log2fc: 3
  min_log10p: 3
  window: 100

negatives:
  strategy: gc-matched
  gc_candidates: 30
  source: gtf                            # stranded UTR / exonic regions built from the GTF
  region_classes: [UTR, exonic]          # IGF2BP2 binds mature mRNA
  match_region: true                     # each peak's negatives from its own class, same strand

split:
  leakage: report

evaluation:
  n_seeds: 5
  bootstrap: 1000

model:
  lr_kmers: [3, 4, 5]                    # readable LR k-mers (GGAC is a 4-mer)

interpretation:
  n_sequences: 500
  motif_db: null                         # e.g. ~/ref/motif_databases/RNA/Ray2013_rbp_Homo_sapiens.meme
  enrichment: true                       # needs internet
