# Example config. Copy it, point the paths at your own files, then:
#   rbp-pipeline run example/config.yaml
name: IGF2BP2
input: ~/ref/IGF2BP2_peaks.bed
output_dir: results

reference:
  genome: ~/ref/GRCh38.primary_assembly.genome.fa
  genes_bed: ~/ref/exons_merged.bed        # IGF2BP2 binds exons/UTRs -> exon-matched negatives
  gtf: ~/ref/gencode.v49.primary_assembly.annotation.gtf

peaks:
  min_log2fc: 3
  min_log10p: 3
  window: 100

negatives:
  strategy: gc-matched
  gc_candidates: 30
